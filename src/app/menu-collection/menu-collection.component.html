<div class="page page-wide">
  <header class="page-header">
    <h1 class="page-title">精選合菜</h1>
    <p class="muted">適合家庭聚餐與宴客，建議提前來電預訂。</p>
  </header>

  <ul role="list" class="collections">
    @for (classify of classifies; track classify.label) {
      <li class="card">
        <h2 class="collection-price price">${{ classify.label | number }}</h2>
        <p class="muted">{{ classify.items.length }} 道菜</p>
        <ol class="collection-items">
          @for (item of classify.items; track $index) {
            <li>{{ item }}</li>
          }
        </ol>
      </li>
    }
  </ul>

  <aside class="reserve">
    <p>合菜內容與價格可能依季節調整，請以店家說明為準。</p>
    <a class="cta cta-primary" [href]="store.phoneHref">
      <app-icon svgIcon="phone"></app-icon>電話預訂 {{ store.phone }}
    </a>
  </aside>
</div>
