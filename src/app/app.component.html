<header class="app-header">
  <a class="brand" routerLink="/" (click)="onNavClick('/')">
    <app-icon svgIcon="goose"></app-icon>
    <span class="brand-name">{{ storeName }}</span>
  </a>

  <nav class="top-nav" aria-label="主要導覽">
    <ng-container *ngTemplateOutlet="navLinks"></ng-container>
  </nav>

  <button
    type="button"
    class="icon-button"
    popovertarget="display-settings"
    aria-label="顯示設定"
  >
    <app-icon svgIcon="format-size"></app-icon>
  </button>
</header>

<main #mainEl class="scrollbar-color overflow-auto relative">
  <router-outlet></router-outlet>
</main>

<nav class="bottom-nav" aria-label="主要導覽">
  <ng-container *ngTemplateOutlet="navLinks"></ng-container>
</nav>

<ng-template #navLinks>
  @for (item of navItems; track item.label) {
    <a
      class="nav-link"
      [routerLink]="item.link"
      [fragment]="item.fragment"
      routerLinkActive="is-active"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="item.match"
      (click)="onNavClick(item.link, item.fragment)"
    >
      <app-icon [svgIcon]="item.icon"></app-icon>
      <span>{{ item.label }}</span>
      @if (item.link === "/menu" && cart.count()) {
        <span class="nav-badge" aria-label="已選品項數">{{
          cart.count()
        }}</span>
      }
    </a>
  }
</ng-template>

<div id="display-settings" popover class="settings">
  <fieldset class="settings-group">
    <legend>外觀</legend>
    <div class="segmented">
      @for (option of themes; track option.value) {
        <button
          type="button"
          [class.is-active]="theme() === option.value"
          [attr.aria-pressed]="theme() === option.value"
          (click)="theme.set(option.value)"
        >
          {{ option.label }}
        </button>
      }
    </div>
  </fieldset>
  <fieldset class="settings-group">
    <legend>字級</legend>
    <div class="segmented">
      @for (option of fontSizes; track option.value) {
        <button
          type="button"
          [class.is-active]="fontSize() === option.value"
          [attr.aria-pressed]="fontSize() === option.value"
          (click)="fontSize.set(option.value)"
        >
          {{ option.label }}
        </button>
      }
    </div>
  </fieldset>
</div>

@if (loadModuleIndicator$ | async) {
  <div class="loading-indicator fixed top-0 w-full"></div>
}
